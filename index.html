<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{BRAND}}</title>
<link rel="icon" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.skin=localStorage.getItem("te.skin")||"white"}catch(e){document.documentElement.dataset.skin="white"}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  /* Home shows exactly one thing: "do this." Do not pile cards/stats/lists back on. */
  .exam{padding:26px 0 6px}
  .exam .k{font-size:15px;color:var(--ink-3);font-weight:700;display:flex;gap:6px;align-items:center}
  .exam .d{font-size:44px;font-weight:900;letter-spacing:-.06em;line-height:1.05;margin-top:2px}
  .exam .d small{font-size:17px;color:var(--ink-3);font-weight:700;letter-spacing:-.02em;margin-left:8px}
  .todo{margin-top:18px;padding:22px 20px;border:1.5px solid var(--ink);border-radius:var(--r3);background:var(--surface);position:relative}
  .todo h2{font-size:23px}
  .todo .t{font-size:15.5px;color:var(--ink-3);margin-top:4px}
  .todo ul{list-style:none;padding:0;margin:16px 0 18px;display:flex;flex-direction:column;gap:8px}
  .todo li{display:flex;gap:10px;align-items:baseline;font-size:16px}
  .todo li b{min-width:52px;font-weight:900}
  .todo li span{color:var(--ink-2)}
  .todo .bar{margin-bottom:16px}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .mini div{padding:12px 10px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface)}
  .mini b{display:block;font-size:21px;font-weight:900;letter-spacing:-.04em}
  .mini span{font-size:13px;color:var(--ink-3)}
  /* subject picker — only the learner's own exam subjects. Subjects not ready yet show dimmed */
  .subs{display:flex;gap:6px;overflow-x:auto;padding:16px 0 2px;scrollbar-width:none}
  .subs::-webkit-scrollbar{display:none}
  .subs a,.subs span{flex:none;text-decoration:none;font-size:15px;font-weight:800;padding:8px 14px;border-radius:99px;
    border:1.5px solid var(--line-2);color:var(--ink-2);background:var(--surface);white-space:nowrap}
  .subs a.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .subs span{color:var(--ink-4);border-style:dashed;font-weight:700}
  .subs span small{font-size:12px;margin-left:4px}
  .att{margin-top:18px;padding:14px 16px;border-radius:var(--r3);background:var(--surface-2)}
  .att h3{font-size:15px;color:var(--ink-2)}
  .att summary{cursor:pointer;font-weight:800;font-size:15px;color:var(--ink-2)}
  .mini div{background:var(--surface-2);border:0}
  .alt{margin-top:28px}
  .alt h3{font-size:15px;color:var(--ink-3);margin-bottom:8px}
</style>
</head>
<body>
<div class="page">
  <div class="subs" id="subs"></div>
  <div class="exam">
    <div class="k" id="ek"></div>
    <div class="d num" id="ed"></div>
  </div>

  <div class="todo" id="todo"></div>

  <div class="mini" id="mini"></div>
  <div class="att" id="att"></div>

  <div class="alt">
    <h3>Want to practice something else?</h3>
    <div class="list" id="alt"></div>
  </div>
</div>

<script src="js/brand.js"></script>
<script src="js/catalog.js"></script>
<script src="data/ready.js"></script>
<script src="js/boot.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  "use strict";
  GB.mountNav("index.html");
  var $ = function (id) { return document.getElementById(id); }, esc = GB.esc;

  var tr = GB.track(), dd = GB.dday();
  $("ek").textContent = tr.name + " · " + GB.subject;
  $("subs").innerHTML = GB.subs().map(function (k) {
    if (!CATALOG.ready(k)) return "<span>" + esc(CATALOG.name(k)) + "<small>Coming soon</small></span>";
    return '<a href="index.html?s=' + k + '"' + (k === GB.cur() ? ' class="on"' : "") + ">" + esc(CATALOG.name(k)) + "</a>";
  }).join("");
  $("ed").innerHTML = (dd > 0 ? "D-" + dd : dd === 0 ? "D-DAY" : "Exam date passed") + "<small>" + GB.goal().replace(/-/g, "/") +
    ' <span class="chip">' + GB.goalMark() + "</span></small>";

  var t = GB.today(), nm = GB.name();
  var newN = t.seq.filter(function (s) { return s.k === "ox" && !s.re; }).length;
  var prN = t.seq.filter(function (s) { return s.k === "pair"; }).length;
  var foci = t.foci.slice(0, 3).map(function (n) { return n.name; });
  var h;
  if (t.finished) {
    h = '<h2>You’re done for today</h2><p class="t">You finished ' + t.total + " sentences. Want more? Try the hard True/False set.</p>" +
        '<div style="margin-top:18px"><a class="btn block" href="ox.html?mode=hard">Hard True/False</a></div>';
  } else {
    h = '<h2>' + (nm ? esc(nm) + ", " : "") + (t.done ? "Let’s keep going — " : "") + "how about " + t.min + " minutes?</h2>" +
        '<p class="t">About ' + t.min + " min · " + t.total + " sentences</p>" +
        "<ul>" +
        (t.re ? "<li><b class=\"num\">" + t.re + "</b><span>Review — missed items, or ones due for another look</span></li>" : "") +
        "<li><b class=\"num\">" + newN + "</b><span>New — " + esc(foci.join(" · ")) + "</span></li>" +
        (prN ? "<li><b class=\"num\">" + prN + "</b><span>Confusable pairs</span></li>" : "") +
        "</ul>" +
        (t.done ? '<div class="bar"><i style="width:' + Math.round(t.done / t.total * 100) + '%"></i></div>' : "") +
        '<a class="btn block" href="ox.html">' + (t.done ? "Continue · " + t.done + " / " + t.total : "Start") + "</a>";
  }
  $("todo").innerHTML = h;

  /* flame (streak) · shield (tier) · attendance (weekly + monthly) */
  var FLAME = '<svg viewBox="0 0 24 24"><path fill="#F97316" d="M12 2c1 3.5 4.5 5.2 4.5 9.5A4.5 4.5 0 0 1 12 16a4.5 4.5 0 0 1-4.5-4.5c0-1.8.8-3.1 1.8-4.1.1 1.5.9 2.6 2 2.9C11 8 11.2 4.6 12 2z"/><path fill="#FDBA74" d="M12 22a6 6 0 0 1-6-6c0-2.3 1.2-4 2.6-5.3-.1 2.5 1.4 4.3 3.4 4.3s3.5-1.6 3.4-4.3C16.8 12 18 13.7 18 16a6 6 0 0 1-6 6z"/></svg>';
  var SHIELD = ["#B7794B", "#9CA3AF", "#EAB308", "#22D3EE", "#60A5FA"];
  var tr2 = GB.tier();
  var shield = '<svg viewBox="0 0 34 38"><path d="M17 1 32 6v12c0 9.5-6.4 16.2-15 19C8.4 34.2 2 27.5 2 18V6z" fill="' + SHIELD[tr2.rank] + '"/><path d="M17 5 28 9v9c0 7.2-4.6 12.4-11 14.8C10.6 30.4 6 25.2 6 18V9z" fill="rgba(255,255,255,.28)"/></svg>';
  $("mini").innerHTML =
    '<div><b class="num flame">' + FLAME + GB.streak() + "</b><span>Day streak</span></div>" +
    (GB.tierOn() ? '<div><b class="shield">' + shield + '<span style="font-size:16px">' + tr2.name + "</span></b><span>" + GB.num(tr2.held) + " sentences held long-term</span></div>"
                 : '<div><b class="num">' + GB.overall().prog + "%</b><span>Sentences solved</span></div>") +
    '<div><b class="num">' + GB.todayCount() + "</b><span>Solved today</span></div>";
  (function attendance() {
    var D = GB.days(), now = new Date(), y = now.getFullYear(), m = now.getMonth();
    function ymd(d) { return GB.ymd(d); }
    var DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    var wk = "", mo = "", w0 = new Date(now); w0.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    for (var i = 0; i < 7; i++) {
      var d = new Date(w0); d.setDate(w0.getDate() + i);
      wk += '<i class="' + (D[ymd(d)] ? "on" : "") + (ymd(d) === ymd(now) ? " today" : "") + '">' + DOW[i] + "</i>";
    }
    var first = new Date(y, m, 1), pad = (first.getDay() + 6) % 7, last = new Date(y, m + 1, 0).getDate();
    mo = DOW.map(function (c) { return "<b>" + c + "</b>"; }).join("");
    for (var k = 0; k < pad; k++) mo += '<i class="blank"></i>';
    for (var dd = 1; dd <= last; dd++) {
      var dt = new Date(y, m, dd);
      mo += '<i class="' + (D[ymd(dt)] ? "on" : "") + (ymd(dt) === ymd(now) ? " today" : "") + '">' + dd + "</i>";
    }
    var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    $("att").innerHTML = '<h3>This week</h3><div class="cal">' + wk + '</div>' +
      '<details style="margin-top:10px"><summary>' + MONTHS[m] + " attendance</summary>" + '<div class="cal">' + mo + "</div></details>";
  })();

  var wrong = GB.wrongList().length;
  $("alt").innerHTML =
    '<a class="row" href="ox.html?mode=hard"><span class="t"><b>Hard True/False</b><span>Sentences with one or two words changed to make them false</span></span><span class="go">›</span></a>' +
    '<a class="row" href="ox.html?mode=pair"><span class="t"><b>Confusable pairs</b><span>Pick the correct one of two similar past-question sentences</span></span><span class="go">›</span></a>' +
    (wrong ? '<a class="row" href="ox.html?mode=wrong"><span class="t"><b>Retry missed sentences</b><span>' + wrong + "</span></span><span class=\"go\">›</span></a>" : "");
})();
</script>
</body>
</html>
