<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards — {{BRAND}}</title>
<link rel="icon" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.skin=localStorage.getItem("te.skin")||"white"}catch(e){document.documentElement.dataset.skin="white"}</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/features.css">
<style>.hd{padding:26px 0 4px}.hd h1{font-size:26px}.hd p{color:var(--ink-3);margin:4px 0 0}</style>
</head>
<body>
<div class="page">
  <div class="hd"><h1>Flashcards</h1><p id="sub" class="muted" style="margin:4px 0 0"></p></div>
  <div id="stage"></div>
</div>
<script src="js/brand.js"></script>
<script src="js/pwa.js"></script>
<script src="js/catalog.js"></script>
<script src="data/ready.js"></script>
<script src="js/boot.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  "use strict";
  GB.mountNav("drill.html");
  var esc = GB.esc, $ = function (id) { return document.getElementById(id); };
  var queue = GB.dueCards(), pos = 0, seen = 0, got = 0;
  function head() { var all = GB.cardList().length; $("sub").textContent = all + " card" + (all === 1 ? "" : "s") + " + " + queue.length + " due"; }
  function show() {
    head();
    if (pos >= queue.length) {
      var all = GB.cardList();
      $("stage").innerHTML = '<div class="done"><div class="big">' + (seen ? got + " / " + seen : all.length ? "None due" : "") + "</div><p class=\"muted\">" +
        "" + "</p>" +
        '<div class="acts" style="justify-content:center"><a class="btn ghost" href="drill.html">Training</a></div></div>' + list(all);
      wireList(); return;
    }
    var c = queue[pos], flipped = false;
    $("stage").innerHTML = '<div class="qcard flip" id="card"><div class="src"><span class="chip">' + esc(c.topic || "") + '</span><span class="chip">' + (pos + 1) + " / " + queue.length + '</span></div>' +
      '<div class="lab">Front</div><p class="sent">' + esc(c.front) + '</p><div id="bk"></div></div>' +
      '<div class="acts" id="ac"><button class="btn" id="fl">Show answer</button></div>';
    $("fl").onclick = function () {
      if (flipped) return; flipped = true;
      $("bk").innerHTML = '<div class="pair"><div class="lab">Back</div><p><b>' + esc(c.ans) + "</b></p>" + (c.rule ? "<p>" + esc(c.rule) + "</p>" : "") +
        (c.why && c.why !== c.rule ? '<p class="muted">' + esc(c.why) + "</p>" : "") + (c.cite ? '<p class="basis"><b>Basis</b> ' + esc(c.cite) + "</p>" : "") + "</div>";
      $("ac").innerHTML = '<button class="btn ghost" id="no">Missed</button><button class="btn" id="ok">Got it</button>';
      $("no").onclick = function () { grade(false); }; $("ok").onclick = function () { grade(true); };
    };
    function grade(ok) { GB.gradeCard(c.key, c.id, ok); seen++; if (ok) got++; pos++; show(); }
  }
  function list(all) {
    if (!all.length) return "";
    return '<h3 style="font-size:15px;color:var(--ink-3);margin:22px 0 8px">All cards</h3><div class="list">' + all.map(function (c) {
      return '<div class="row"><span class="t"><b>' + esc(c.front.length > 90 ? c.front.slice(0, 90) + "…" : c.front) + "</b><span>" + esc(c.ans) + '</span></span><button type="button" class="btn ghost sm" data-k="' + c.key + '" data-i="' + c.id + '">Delete</button></div>'; }).join("") + "</div>";
  }
  function wireList() {
    $("stage").querySelectorAll("button[data-i]").forEach(function (b) { b.onclick = function () { GB.dropCard(b.dataset.i, b.dataset.k); queue = GB.dueCards(); pos = 0; seen = 0; got = 0; show(); }; });
  }
  show();
})();
</script>
</body>
</html>
