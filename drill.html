<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Training — {{BRAND}}</title>
<link rel="icon" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.skin=localStorage.getItem("te.skin")||"white"}catch(e){document.documentElement.dataset.skin="white"}</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/features.css">
<style>
  .hd{padding:26px 0 4px}
  .hd h1{font-size:26px}
  .hd p{color:var(--ink-3);margin:4px 0 0}
  .row .n{font-weight:900;font-size:15px;color:var(--ink-3);white-space:nowrap}
</style>
</head>
<body>
<div class="page">
  <div class="hd"><h1>Training</h1></div>
  <div class="list sec" id="ls"></div>
</div>
<script src="js/brand.js"></script>
<script src="js/pwa.js"></script>
<script src="js/catalog.js"></script>
<script src="data/ready.js"></script>
<script src="js/boot.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  "use strict";
  GB.mountNav("drill.html");
  var S = GB.state(), done = Object.keys(S.pairs).filter(function (k) { return S.pairs[k].ok; }).length;
  var wrong = GB.wrongList().length, mis = Object.keys(S.ans).filter(function (id) { return S.ans[id].kind === "misconception"; }).length;
  var flagged = GB.flagList().length, hasOX = GB.pairs().length > 0;
  var rows = [
    ["exam.html", "Mock exam", "", "12 / 24 / 36 / 72"],
    ["ox.html?mode=wrong", "Missed questions", "", wrong],
    ["ox.html?mode=flag", "Flagged questions", "", flagged],
    ["cards.html", "Flashcards", "", GB.dueCards().length + " due"],
    ["insights.html", "Insights", "", "›"],
    ["plan.html", "Study plan", "", GB.planOn() ? GB.hours() + " h" : "Not set"],
    ["method.html", "Formulas", "", "›"],
    ["skilltree.html", "Units", "", GB.nodes.length]
  ];
  if (GB.exam().sec === "FAR") rows.unshift(["je.html", "Journal entry drill", "", "150"]);
  if (hasOX) rows = rows.concat([
    ["ox.html?mode=hard", "Hard True/False", (mis ? "Certain + wrong " + mis : ""), GB.pairs().length],
    ["ox.html?mode=pair", "Confusable pairs", "", done + " / " + GB.pairs().length],
    ["ox.html?mode=speed", "60-second sprint", "", "60 s"]
  ]);
  document.getElementById("ls").innerHTML = rows.map(function (r) {
    return '<a class="row" href="' + r[0] + '"><span class="t"><b>' + r[1] + "</b>" + (r[2] ? "<span>" + GB.esc(r[2]) + "</span>" : "") + '</span><span class="n num">' + r[3] + "</span></a>";
  }).join("");
})();
</script>
</body>
</html>
