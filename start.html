<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get started — {{BRAND}}</title>
<link rel="icon" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.skin=localStorage.getItem("te.skin")||"white"}catch(e){document.documentElement.dataset.skin="white"}</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/features.css">
<style>
  /* first-time setup — one question per screen, one big button */
  .wrap{max-width:520px;margin:0 auto;padding:28px 16px 48px;min-height:100vh;display:flex;flex-direction:column}
  .dots{display:flex;gap:6px;margin-bottom:28px}
  .dots i{flex:1;height:4px;border-radius:99px;background:var(--surface-3)}
  .dots i.on{background:var(--ink)}
  h1{font-size:27px;letter-spacing:-.05em}
  .lead{color:var(--ink-3);font-size:16px;margin:8px 0 0}
  .body{flex:1;margin-top:26px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opts button{appearance:none;position:relative;text-align:left;border:1.5px solid var(--line-2);background:var(--surface);
    border-radius:var(--r3);padding:16px 18px;font-size:17px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;line-height:1.35}
  .opts button:hover{border-color:var(--line-3)}
  .opts button small{display:block;font-size:14px;color:var(--ink-3);font-weight:600;line-height:1.4}
  .opts button[aria-pressed="true"]{border:2px solid var(--ink);background:var(--surface-3)}
  .opts.g2{display:grid;grid-template-columns:1fr 1fr}
  input[type=text],input[type=date]{width:100%;font:inherit;font-size:19px;padding:15px 16px;border:1.5px solid var(--line-2);
    border-radius:var(--r3);background:var(--surface);color:var(--ink)}
  input:focus{outline:none;border-color:var(--ink)}
  .foot{display:flex;flex-direction:column;gap:10px;margin-top:24px}
  .skip{appearance:none;border:0;background:none;color:var(--ink-4);font-size:15px;cursor:pointer;padding:6px;position:relative}
  .skip .tip{display:none;position:absolute;bottom:130%;left:50%;transform:translateX(-50%);width:250px;background:var(--ink);color:var(--bg);
    font-size:13.5px;padding:8px 10px;border-radius:var(--r1);line-height:1.45}
  .skip:hover .tip,.skip:focus .tip,.skip.on .tip{display:block}
  .dateline{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:28px;font-weight:900;letter-spacing:-.05em}
  .qhd{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--ink-3);font-weight:700}
  .perpart{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  .perpart div{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:15px}
  .perpart .bar{grid-column:1 / -1}
  .from{margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:var(--r3);background:var(--surface)}
  .from b{display:block;font-size:14px;color:var(--ink-3);margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="dots" id="dots"></div>
  <div id="scr"></div>
</div>

<script src="js/brand.js"></script>
<script src="js/pwa.js"></script>
<script src="js/catalog.js"></script>
<script src="data/ready.js"></script>
<script src="js/boot.js"></script>
<script src="js/judge.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); }, esc = GB.esc;
  var LIMIT = 90000;     /* time limit per placement-check question — 90s (multiple-choice items with a short case) */
  var LETTERS = "ABCDE";
  var STEPS = ["intro", "exam", "series", "subs", "name", "date", "min", "check", "done"];
  /* The placement check draws from every ready subject at once (GB.loadPool), so this page never has to reload itself. */
  var startStep = new URLSearchParams(location.search).get("step");
  var at = 0, A = { rec: [] };

  function dots() {
    $("dots").innerHTML = STEPS.map(function (s, i) { return '<i class="' + (i <= at ? "on" : "") + '"></i>'; }).join("");
  }
  function go(i) { at = i; dots(); SCREENS[STEPS[i]](); window.scrollTo(0, 0); }
  function nextStep() { go(at + 1); }

  var SCREENS = {
    intro: function () {
      $("scr").innerHTML = '<h1>Exam-style practice</h1>' +
        '<div class="body"></div><div class="foot"><button class="btn block" id="n">Start</button></div>';
      $("n").onclick = nextStep;
    },
    name: function () {
      $("scr").innerHTML = "<h1>Nickname</h1>" +
        '<div class="body"><input type="text" id="nm" maxlength="12" placeholder="Nickname" value="' + esc(GB.name()) + '"></div>' +
        '<div class="foot"><button class="btn block" id="n">Next</button></div>';
      $("nm").focus();
      $("nm").onkeydown = function (e) { if (e.key === "Enter") $("n").click(); };
      $("n").onclick = function () { GB.setName($("nm").value); nextStep(); };
    },
    exam: function () {
      var cur = null;
      try { cur = (JSON.parse(localStorage.getItem("te.pref.v1") || "{}").exam) || null; } catch (e) {}
      $("scr").innerHTML = "<h1>Exam</h1>" +
        '<div class="body"><div class="opts" id="op">' + CATALOG.EXAMS.map(function (e) {
          return '<button type="button" data-v="' + e.id + '" aria-pressed="' + (e.id === cur) + '">' + e.name + "</button>";
        }).join("") + "</div></div>";
      $("op").querySelectorAll("button").forEach(function (b) {
        b.onclick = function () {
          b.setAttribute("aria-pressed", "true");
          var e = CATALOG.exam(b.dataset.v);
          GB.setExam(e.id, null);
          setTimeout(function () { go(STEPS.indexOf(e.series ? "series" : "subs")); }, 120);
        };
      });
    },
    series: function () {
      var e = GB.exam();
      if (!e.series) return go(STEPS.indexOf("subs"));
      $("scr").innerHTML = "<h1>Track</h1>" +
        '<div class="body"><div class="opts" id="op">' + e.series.map(function (x) {
          return '<button type="button" data-v="' + x.id + '">' + x.name + "<small>" +
            x.subs.map(function (k) { return CATALOG.name(k); }).join(" + ") + "</small></button>";
        }).join("") + "</div></div>";
      $("op").querySelectorAll("button").forEach(function (b) {
        b.onclick = function () { b.setAttribute("aria-pressed", "true"); GB.setExam(e.id, b.dataset.v); setTimeout(nextStep, 120); };
      });
    },
    subs: function () {
      var ss = GB.subs();
      $("scr").innerHTML = "<h1>Subjects</h1>" +
        '<div class="body"><div class="opts">' + ss.map(function (k) {
          var r = CATALOG.ready(k);
          return '<button type="button" disabled style="cursor:default;opacity:1">' + CATALOG.name(k) + "<small>" +
            (r ? GB.num(CATALOG.count(k)) + " questions" : "Coming soon") + "</small></button>";
        }).join("") + "</div></div>" +
        '<div class="foot"><button class="btn block" id="n">Continue</button></div>';
      $("n").onclick = nextStep;
    },
    date: function () {
      var tr = GB.track();
      $("scr").innerHTML = "<h1>Test date</h1>" +
        '<div class="body"><div class="dateline num"><span id="dv">' + (GB.goal() ? GB.goal().replace(/-/g, "/") : "Not set") + '</span><span class="chip" id="dm">' + GB.goalMark() + "</span></div>" +
        '<input type="date" id="di" value="' + (GB.goal() || "") + '"></div>' +
        '<div class="foot"><button class="btn block" id="n">Use this date</button><button class="skip" id="later">Later</button></div>';
      $("di").onchange = function () {
        if (!this.value) return;
        GB.setGoal(this.value, true);
        $("dv").textContent = this.value.replace(/-/g, "/"); $("dm").textContent = "custom";
      };
      $("n").onclick = nextStep;
      $("later").onclick = nextStep;
    },
    min: function () {
      var cur = GB.minutes();
      $("scr").innerHTML = "<h1>Minutes per day</h1>" +
        '<div class="body"><div class="opts g2" id="op">' + [10, 15, 20, 30].map(function (m) {
          return '<button type="button" data-v="' + m + '" aria-pressed="' + (m === cur) + '">' + m + " min<small>~" + Math.max(1, Math.round(m * 60 / 60)) + " questions</small>" +
            (m === 15 ? '<span class="bdg">Recommended</span>' : "") + "</button>";
        }).join("") + "</div></div>";
      $("op").querySelectorAll("button").forEach(function (b) {
        b.onclick = function () { GB.setMinutes(+b.dataset.v); b.setAttribute("aria-pressed", "true"); setTimeout(nextStep, 120); };
      });
    },
    check: function () {
      var mine = GB.subs().filter(function (k) { return CATALOG.ready(k); });
      if (!mine.length) return go(STEPS.indexOf("done"));
      $("scr").innerHTML = '<h1>Placement check</h1><p class="lead">Loading</p>';
      GB.loadPool(function (pool) {
        var set = GB.placementSet(pool, 20), i = 0, timer = null, t0 = 0;
        if (set.length < 5) return go(STEPS.indexOf("done"));   /* not enough multiple-choice questions — skip the check */
        function one() {
          if (i >= set.length) { clearInterval(timer); return fin(); }
          var x = set[i], q = x.q, mc = q.mc; t0 = Date.now();
          $("scr").innerHTML = '<div class="qhd"><span>Placement check ' + (i + 1) + " / " + set.length + '</span><span class="chip">' + esc(mc.tags ? "Area " + mc.tags.area : x.node.name) + "</span></div>" +
            '<div class="tm" id="tm"><i style="width:100%"></i></div>' +
            '<div class="qcard" style="margin-top:14px"><p class="sent">' + esc(mc.s) + "</p>" + (mc.d ? '<div class="case mcdata" style="margin:12px 0 0">' + esc(mc.d) + "</div>" : "") + "</div>" +
            '<div class="mcb" id="oxb">' + mc.o.map(function (o, k) { return '<button type="button" data-a="' + (k + 1) + '"><b>' + LETTERS[k] + "</b><span>" + esc(o) + "</span></button>"; }).join("") + "</div>" +
            '<div class="foot"><button class="skip" id="sk">Skip</button></div>';
          var locked = false;
          function pick(a) {
            if (locked) return; locked = true;
            var ms = Date.now() - t0, to = a == null, ok = !to && a === mc.a;
            $("oxb").querySelectorAll("button").forEach(function (b) {
              b.disabled = true;
              if (+b.dataset.a === mc.a) b.dataset.s = "ok"; else if (a != null && +b.dataset.a === a) b.dataset.s = "no";
            });
            A.rec.push({ id: q.i, key: x.key, area: x.area || "-", ok: ok, ms: ms, to: to });
            GB.answerIn(x.key, q.i, ok, { ms: ms, kind: to ? "timeout" : ok ? "right" : "wrong", pick: to ? null : a - 1, wt: q.mc && q.mc.wt });
            i++; setTimeout(one, ok ? 500 : 1300);
          }
          $("oxb").querySelectorAll("button").forEach(function (b) { b.onclick = function () { pick(+b.dataset.a); }; });
          var armed = false;
          $("sk").onclick = function () {
            if (!armed) { armed = true; this.classList.add("on"); this.firstChild.textContent = "Confirm skip";
              var me = this; setTimeout(function () { armed = false; me.classList.remove("on"); me.firstChild.textContent = "Skip"; }, 6000); return; }
            clearInterval(timer); A.skipped = true; fin();
          };
          clearInterval(timer);
          timer = setInterval(function () {
            var left = LIMIT - (Date.now() - t0), el = $("tm");
            if (!el) return;
            el.firstChild.style.width = Math.max(0, left / LIMIT * 100) + "%";
            el.classList.toggle("low", left < LIMIT * 0.15);
            if (left <= 0) { clearInterval(timer); pick(null); }
          }, 200);
        }
        function fin() { if (A.rec.length) A.place = GB.setPlacement(A.rec); nextStep(); }
        one();
      });
    },
    done: function () {
      var p = A.place || GB.placement() || { n: 0, ok: 0, per: {} };
      /* subject that Home will open on = the weakest Area of the check (GB.setPlacement stored it) */
      var subj = null;
      if (p.n && p.weakArea) GB.subs().forEach(function (k) { if (CATALOG.area(k) === p.weakArea && CATALOG.ready(k)) subj = k; });
      var names = {};
      GB.subs().forEach(function (k) { if (CATALOG.area(k)) names[CATALOG.area(k)] = CATALOG.name(k); });
      var fast = A.rec.filter(function (r) { return r.ok && r.ms < 20000; }).length;
      $("scr").innerHTML = "<h1>" + (p.n ? p.ok + " of " + p.n + " correct" : "Ready") + "</h1>" +
        (p.n ? '<p class="lead">' + A.rec.filter(function (r) { return r.to; }).length + " timed out</p>" : "") +
        '<div class="body">' +
        (p.n ? '<div class="perpart">' + Object.keys(p.per).map(function (ar) {
          var x = p.per[ar];
          return "<div><span>" + esc(names[ar] || ("Area " + ar)) + '</span><span class="num" style="text-align:right">' + x.ok + " / " + x.n + '</span><div class="bar"><i style="width:' + Math.round(x.ok / x.n * 100) + '%"></i></div></div>';
        }).join("") + "</div>" : "") +
        (subj ? '<div class="from"><b>Starting here</b>' + esc(CATALOG.name(subj)) + "</div>" : "") +
        '</div><div class="foot"><button class="btn block" id="n">Today</button></div>';
      $("n").onclick = function () { GB.setOnboarded(); location.href = "index.html"; };
    }
  };
  go(startStep && STEPS.indexOf(startStep) >= 0 ? STEPS.indexOf(startStep) : 0);
})();
</script>
</body>
</html>
