<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>True/False — {{BRAND}}</title>
<link rel="icon" href="icons/favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>try{document.documentElement.dataset.skin=localStorage.getItem("te.skin")||"white"}catch(e){document.documentElement.dataset.skin="white"}</script>
<link rel="stylesheet" href="css/app.css">
<style>
  .hd{display:flex;align-items:center;gap:10px;padding:18px 0 0}
  .hd h1{font-size:20px;flex:1;min-width:0}
  .hd .cnt{font-size:15px;color:var(--ink-3)}
  .hd a.x{color:var(--ink-4);text-decoration:none;font-size:22px;line-height:1;padding:4px}
  .lock{opacity:.35;pointer-events:none}
  .more{margin-top:10px;font-size:14.5px;color:var(--ink-3)}
  .readhd{display:flex;align-items:center;gap:10px;margin-top:18px}
  .readhd h2{font-size:18px;flex:1}
  .empty{padding:48px 8px;text-align:center;color:var(--ink-3)}
  .spd{font-size:40px;font-weight:900;text-align:center;letter-spacing:-.05em}
</style>
</head>
<body class="focus">
<div class="page">
  <div class="hd"><h1 id="ttl">True/False</h1><span class="cnt num" id="cnt"></span><a class="x" href="index.html" title="Quit">✕</a></div>
  <div class="stones" id="prog"></div>
  <div id="stage"></div>
</div>

<script src="js/brand.js"></script>
<script src="js/catalog.js"></script>
<script src="data/ready.js"></script>
<script src="js/boot.js"></script>
<script src="js/judge.js"></script>
<script src="js/store.js"></script>
<script>
(function () {
  "use strict";
  GB.mountNav("ox.html");
  var qsp = new URLSearchParams(location.search);
  var mode = qsp.get("mode") || (qsp.get("node") ? "node" : qsp.get("read") ? "read" : "today");
  var nodeNo = +(qsp.get("node") || qsp.get("read") || 0);
  var $ = function (id) { return document.getElementById(id); };
  var esc = GB.esc;
  var LETTERS = "ABCDE";

  /* ── build the session queue ──
     "today" pulls from the saved today-list's unfinished items. Everything else is 10 at a time. */
  var seq = [], todayIdx = [];
  if (mode === "today") {
    var t = GB.today();
    t.seq.forEach(function (s, i) { if (!s.done) { seq.push(s); todayIdx.push(i); } });
    $("ttl").textContent = "Today — " + t.min + " min";
  } else if (mode === "node") {
    var nd = GB.node(nodeNo);
    var wrong = GB.qs(nodeNo).filter(function (q) { var a = GB.answered(q.i); return a && !a.ok; });
    seq = wrong.concat(GB.freshOf(nodeNo, 10)).slice(0, 10).map(function (q) { return { k: "ox", id: q.i }; });
    GB.pairs(nodeNo).slice(0, 2).forEach(function (p, i) { seq.splice(3 + i * 4, 0, { k: "pair", id: p.id }); });
    $("ttl").textContent = nd ? nd.name : "True/False";
  } else if (mode === "wrong") {
    seq = GB.wrongList().slice(0, 15).map(function (id) { return { k: "ox", id: id }; });
    $("ttl").textContent = "Retry missed sentences";
  } else if (mode === "pair") {
    var pl = (nodeNo ? GB.pairs(nodeNo) : GB.pairs()).filter(function (p) { return !GB.state().pairs[p.id] || !GB.state().pairs[p.id].ok; });
    shuffle(pl, 17);
    seq = pl.slice(0, 10).map(function (p) { return { k: "pair", id: p.id }; });
    $("ttl").textContent = "Confusable pairs";
  } else if (mode === "hard") {
    /* hard True/False — the **false side** of a confusable pair (differs from the true
       sentence by only a word or two) + sentences the learner was confident about but missed.
       No new sentences are generated. */
    var mine = Object.keys(GB.state().ans).filter(function (id) { var a = GB.state().ans[id]; return a.kind === "misconception" && GB.item(id); });
    var traps = GB.pairs().map(function (p) { return p.x.i; }).filter(function (id) { var a = GB.answered(id); return GB.item(id) && !(a && a.ok && a.conf === "sure"); });
    shuffle(traps, new Date().getDate());
    seq = mine.concat(traps).slice(0, 12).map(function (id) { return { k: "ox", id: id }; });
    $("ttl").textContent = "Hard True/False";
  } else if (mode === "speed") {
    $("ttl").textContent = "60-second sprint";
  }

  function shuffle(a, seed) {
    var s = seed || 1;
    for (var i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; var j = Math.floor(s / 233280 * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }

  var pos = 0, results = [], streakBy = {};

  function drawProg() {
    var n = seq.length;
    $("cnt").textContent = n ? Math.min(pos + 1, n) + " / " + n : "";
    /* stepping stones — keep the remaining count always visible. When there are a lot, show only the 18 around the current position */
    var from = Math.max(0, Math.min(pos - 6, n - 18)), to = Math.min(n, from + 18);
    var h = "";
    for (var i = from; i < to; i++) {
      var r = results[i];
      h += "<i class=\"" + (r ? (r.kind === "misconception" ? "warn" : r.ok ? "ok" : "no") : i === pos ? "now" : "") + "\"></i>";
    }
    $("prog").innerHTML = h + '<span class="left">' + Math.max(0, n - pos - (results[pos] ? 1 : 0)) + " left</span>";
  }

  function nodeChip(no) { var n = GB.node(no); return n ? '<span class="chip">' + esc(n.name) + "</span>" : ""; }

  /* the most similar **true** past sentence on the same topic — has the learner re-read the
     correct version of a missed sentence (in place of a written explanation) */
  function grams(t) { var s = t.replace(/\s+/g, ""), g = {}; for (var i = 0; i < s.length - 2; i++) g[s.substr(i, 3)] = 1; return g; }
  function sim(a, b) { var A = grams(a), B = grams(b), i = 0, u = 0, k; for (k in A) { u++; if (B[k]) i++; } for (k in B) if (!A[k]) u++; return u ? i / u : 0; }
  function nearestO(q) {
    var best = null, bs = 0;
    GB.qs(q.n).forEach(function (o) {
      if (o.ox !== "O" || o.i === q.i) return;
      var s = sim(q.t, o.t); if (s > bs) { bs = s; best = o; }
    });
    return bs >= 0.28 ? best : null;
  }
  function pairOf(id) {
    var ps = GB.pairs(GB.item(id).n);
    for (var i = 0; i < ps.length; i++) if (ps[i].o.i === id || ps[i].x.i === id) return ps[i];
    return null;
  }

  /* ── one True/False sentence ── */
  function showOX(s) {
    var q = GB.item(s.id);
    if (!q) { next(); return; }
    var conf = null, t0 = Date.now(), done = false;
    /* multiple-choice past question (3-5 choices) — can't be reduced to one sentence. q.mc = {s: stem, d: source, o: [choices], a: correct} */
    var mc = q.mc, answerKey = mc ? String(mc.a) : q.ox;
    var buttons = mc
      ? '<div class="mcb lock" id="oxb">' + mc.o.map(function (o, i) {
          return '<button type="button" data-a="' + (i + 1) + '"><b>' + LETTERS[i] + "</b><span>" + esc(o) + "</span></button>"; }).join("") + "</div>"
      : '<div class="oxb lock" id="oxb"><button type="button" data-a="O">True</button><button type="button" data-a="X">False</button></div>';
    $("stage").innerHTML =
      '<div class="qcard"><div class="src">' + nodeChip(q.n) + '<span class="chip">' + esc(GB.src(q)) + "</span>" +
        (s.re ? '<span class="chip cta">Review</span>' : "") + "</div>" +
        (q.sa ? '<div class="case"><b>Scenario</b>' + esc(q.sa) + "</div>" : "") +
        (q.tp ? '<div class="topic">' + esc(q.tp) + "</div>" : "") +
        '<p class="sent" id="sent">' + esc(mc ? mc.s : q.t) + "</p>" +
        (mc && mc.d ? '<div class="case mcdata" style="margin:12px 0 0">' + esc(mc.d) + "</div>" : "") + "</div>" +
      '<div class="step"><h3>How confident are you?</h3><div class="conf" id="conf">' +
        [{ v: "sure", name: "Certain" }, { v: "half", name: "Not sure" }].map(function (c, i) { return '<button type="button" data-v="' + c.v + '" aria-pressed="false">' + c.name + "</button>"; }).join("") +
      "</div></div>" +
      buttons +
      '<p class="hint" id="hint">Choose your confidence first</p>' +
      '<div id="after"></div>';
    var cb = $("conf").querySelectorAll("button");
    cb.forEach(function (b) {
      b.onclick = function () {
        if (done) return;
        conf = b.dataset.v;
        cb.forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        $("oxb").classList.remove("lock"); $("hint").textContent = "";
      };
    });
    $("oxb").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (done || !conf) return;
        done = true;
        var pick = b.dataset.a, ok = pick === answerKey, ms = Date.now() - t0;
        $("oxb").querySelectorAll("button").forEach(function (x) {
          x.disabled = true;
          if (x.dataset.a === answerKey) x.dataset.s = "ok"; else if (x === b) x.dataset.s = "no";
        });
        var st = GB.nodeStat(q.n), prev = GB.answered(q.i);
        var j = JUDGE.judge({ ok: ok, conf: conf, ms: ms, attempt: prev ? prev.n + 1 : 1, mastery: st.mastery,
                             streak: streakBy[q.n] || 0, qid: q.i, leafName: GB.node(q.n).name });
        streakBy[q.n] = ok ? 0 : (streakBy[q.n] || 0) + 1;
        GB.answer(q.i, ok, { conf: conf, ms: ms, kind: j.kind });
        results[pos] = { ok: ok, kind: j.kind, id: q.i };
        document.querySelector(".qcard").classList.add(ok ? "glow-ok" : "glow-no");
        if (mode === "today") GB.markToday(todayIdx[pos]);
        drawProg();

        /* when the verdict says "one more," **actually show one** — say it without following through and the learner stops trusting it */
        var extra = null;
        if (!ok || j.next === "same" || j.next === "similar") {
          var more = GB.freshOf(q.n, 3).filter(function (x) { return !seq.some(function (y) { return y.id === x.i; }); })[0];
          if (more) { extra = more; seq.splice(pos + 1, 0, { k: "ox", id: more.i, add: 1 }); if (mode === "today") todayIdx.splice(pos + 1, 0, -1); drawProg(); }
        }

        var h = '<div class="verdict ' + j.tone + '"><div class="top"><span class="mk">' + (ok ? "✓" : "✕") + "</span>" +
          (ok ? '<span class="reward">+1</span>' : "") + '<span class="chip">' + esc(j.label || { "retryRight": "Correct on retry", "streakWrong": "Missed repeatedly" }[j.kind] || j.kind) + "</span></div>" +
          '<p class="say">' + esc(j.say) + "</p>" +
          '<p class="ans">Correct answer: <b>' + (mc ? LETTERS[+answerKey - 1] : (q.ox === "O" ? "True" : "False")) + "</b>" + (mc ? "" : q.ox === "X" ? " — this statement is false." : " — this statement is true.") + "</p>" +
          ((mc ? mc.cite : q.cite) ? '<p class="ans"><b>' + esc(mc ? mc.cite : q.cite) + "</b> — " + esc(mc ? mc.rat : q.rat) + "</p>" : "");
        var expl = "";
        var p = pairOf(q.i);
        if (p) {
          var d = GB.markDiff(p.o.t, p.x.t);
          expl += '<div class="pair"><div class="lab">Confusable pair — the difference is highlighted</div>' +
               '<p><b style="color:var(--ok)">True</b> ' + d[0] + "</p>" +
               '<p><b style="color:var(--no)">False</b> ' + d[1] + "</p></div>";
        } else if (!mc && q.ox === "X") {
          var o = nearestO(q);
          if (o) expl += '<div class="pair"><div class="lab">A true past sentence on the same topic — ' + esc(GB.src(o)) + "</div><p>" + GB.markDiff(o.t, q.t)[0] + "</p></div>";
        }
        if (expl) h += '<div class="expl" id="expl"><button type="button">Show explanation</button><div class="body">' + expl + "</div></div>";
        if (extra) h += '<p class="more">Added one more on ' + esc(GB.node(q.n).name) + " right after this one.</p>";
        h += "</div>";
        var readBtn = (j.next === "concept" || j.next === "lecture")
          ? '<button class="btn ghost" id="read">' + JUDGE.nextActions[j.next].t + "</button>" : "";
        h += '<div class="acts">' + readBtn + '<button class="btn" id="nx">Next</button></div>';
        $("after").innerHTML = h;
        $("nx").onclick = next;
        if ($("expl")) $("expl").firstChild.onclick = function () { $("expl").classList.toggle("open"); this.textContent = $("expl").classList.contains("open") ? "Hide explanation" : "Show explanation"; };
        if ($("read")) $("read").onclick = function () { showRead(q.n, true); };
        $("nx").focus({ preventScroll: true });
        $("after").scrollIntoView({ behavior: "smooth", block: "nearest" });
      };
    });
  }

  /* ── confusable pair — pick the true sentence of the two ── */
  function showPair(s) {
    var p = GB.pair(s.id);
    if (!p) { next(); return; }
    var flip = (p.id.charCodeAt(p.id.length - 1) + new Date().getDate()) % 2 === 1;   /* so learners can't just memorize a position */
    var A = flip ? [p.x, p.o] : [p.o, p.x], done = false;
    $("stage").innerHTML =
      '<div class="qcard"><div class="src">' + nodeChip(p.n) + '<span class="chip cta">Confusable pair</span></div>' +
      '<p class="sent" style="font-size:17px">Of these two past-question sentences, pick the <b>true</b> one.</p>' +
      '<div class="two" id="two">' + A.map(function (x, i) {
        return '<button type="button" data-i="' + x.i + '"><b>' + "AB"[i] + '</b><span class="tx">' + esc(x.t) + "</span></button>";
      }).join("") + "</div></div><div id=\"after\"></div>";
    $("two").querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (done) return; done = true;
        var ok = b.dataset.i === p.o.i;
        var d = GB.markDiff(p.o.t, p.x.t);
        $("two").querySelectorAll("button").forEach(function (x) {
          x.disabled = true;
          var isO = x.dataset.i === p.o.i;
          x.querySelector(".tx").innerHTML = isO ? d[0] : d[1];
          if (isO) x.dataset.s = "ok"; else if (x === b) x.dataset.s = "no";
        });
        GB.pairAnswer(p.id, ok);
        results[pos] = { ok: ok, kind: ok ? "right" : "wrong", pair: 1 };
        if (mode === "today") GB.markToday(todayIdx[pos]);
        drawProg();
        $("after").innerHTML = '<div class="verdict ' + (ok ? "good" : "bad") + '"><div class="top"><span class="mk">' + (ok ? "✓" : "✕") + "</span></div>" +
          '<p class="say">' + (ok ? "Correct. The highlighted part is what separates the two sentences." : "Look at the highlighted part — that's where true and false diverge.") + "</p>" +
          '<p class="ans">Source — true: ' + esc((p.o.y || "") + " " + (p.o.e || "")) + " · false: " + esc((p.x.y || "") + " " + (p.x.e || "")) + "</p></div>" +
          '<div class="acts"><button class="btn" id="nx">Next</button></div>';
        $("nx").onclick = next; $("nx").focus({ preventScroll: true });
      };
    });
  }

  /* ── read the true sentences — shows the true past-question sentences for this topic, collected ── */
  function showRead(no, back) {
    var nd = GB.node(no);
    var os = GB.qs(no).filter(function (q) { return q.ox === "O"; })
      .sort(function (a, b) { return (b.y || 0) - (a.y || 0); }).slice(0, 12);
    var h = '<div class="readhd"><h2>' + esc(nd.name) + " — true past-question sentences</h2></div>" +
      '<p class="muted" style="margin:4px 0 0;font-size:14.5px">Only sentences the exam tested as true, newest first.</p>' +
      '<div class="readlist">' + os.map(function (q) { return "<p>" + esc(q.t) + "<small>" + esc(GB.src(q)) + "</small></p>"; }).join("") + "</div>" +
      '<div class="acts">' + (back ? '<button class="btn" id="nx">Keep solving</button>'
                                   : '<a class="btn" href="ox.html?node=' + no + '">Solve this topic’s True/False</a>') + "</div>";
    $("stage").innerHTML = h;
    if (back) $("nx").onclick = next;
    window.scrollTo(0, 0);
  }

  /* ── 60-second sprint — reaction only, no confidence step ── */
  function runSpeed() {
    var pool = [];
    GB.focusNodes(6).forEach(function (n) { pool = pool.concat(GB.qs(n.no).filter(function (q) { return q.t.length <= 80 && !q.sa && !q.mc; })); });
    shuffle(pool, Date.now() % 997);
    var end = Date.now() + 60000, i = 0, ok = 0, n = 0;
    function one() {
      if (Date.now() >= end || i >= pool.length) return fin();
      var q = pool[i++], t0 = Date.now();
      $("stage").innerHTML = '<div class="spd num" id="left"></div><div class="qcard"><div class="src">' + nodeChip(q.n) +
        '</div><p class="sent">' + esc(q.t) + '</p></div><div class="oxb" id="oxb"><button data-a="O">True</button><button data-a="X">False</button></div>';
      $("oxb").querySelectorAll("button").forEach(function (b) {
        b.onclick = function () {
          var good = b.dataset.a === q.ox; n++; if (good) ok++;
          b.dataset.s = good ? "ok" : "no";
          GB.answer(q.i, good, { ms: Date.now() - t0 });
          setTimeout(one, good ? 250 : 900);
        };
      });
    }
    var tick = setInterval(function () {
      var l = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      if ($("left")) $("left").textContent = l + "s";
      if (l <= 0) { clearInterval(tick); fin(); }
    }, 200);
    var fined = false;
    function fin() {
      if (fined) return; fined = true; clearInterval(tick);
      $("stage").innerHTML = '<div class="done"><div class="big num">' + ok + " / " + n + '</div><p class="muted">' + ok + " of " + n + ' correct in 60 seconds</p>' +
        '<div class="acts"><a class="btn ghost" href="drill.html">Back to training</a><a class="btn" href="ox.html?mode=speed">Try again</a></div></div>';
    }
    one();
  }

  function next() {
    pos++;
    drawProg();
    if (pos >= seq.length) return finish();
    var s = seq[pos];
    if (s.k === "pair") showPair(s); else showOX(s);
    window.scrollTo(0, 0);
  }

  function finish() {
    var n = results.filter(Boolean).length, ok = results.filter(function (r) { return r && r.ok; }).length;
    var mis = results.filter(function (r) { return r && r.kind === "misconception"; }).length;
    var tomorrow = GB.dueList().length;
    $("prog").innerHTML = ""; $("cnt").textContent = "";
    var todayDone = mode === "today";
    $("stage").innerHTML = '<div class="done">' +
      (n ? '<div class="big num">' + ok + " / " + n + "</div>" : '<div class="big">Done</div>') +
      '<p class="muted">' + (todayDone ? "You’ve finished today’s work." : "You’ve finished this set.") + "</p>" +
      '<div class="grid3"><div><b class="num">' + ok + "</b><span>Correct</span></div><div><b class=\"num\" style=\"color:var(--warn)\">" + mis +
      '</b><span>Confident but wrong</span></div><div><b class="num">' + GB.streak() + "</b><span>Day streak</span></div></div>" +
      '<div class="acts" style="margin-top:22px"><a class="btn ghost" href="index.html">Home</a>' +
      (mis ? '<a class="btn" href="ox.html?mode=hard">Hard True/False</a>' : '<a class="btn" href="ox.html?mode=wrong">Retry missed sentences</a>') + "</div></div>";
  }

  /* keyboard — 1/2 for confidence, O/X for True/False, Enter for Next */
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    var k = e.key.toLowerCase();
    if (k === "1" || k === "2") { var b = document.querySelectorAll("#conf button")[+k - 1]; if (b) b.click(); }
    else if (k === "o") { var o = document.querySelector('#oxb [data-a="O"]'); if (o) o.click(); }
    else if (k === "x") { var x = document.querySelector('#oxb [data-a="X"]'); if (x) x.click(); }
    else if (k === "enter") { var n = $("nx"); if (n) { e.preventDefault(); n.click(); } }
  });

  if (mode === "read") { showRead(nodeNo, false); $("ttl").textContent = "Read the true sentences"; return; }
  if (mode === "speed") { runSpeed(); return; }
  if (!seq.length) {
    $("stage").innerHTML = '<div class="empty">' + (mode === "today" ? "You’ve finished today’s work. See you tomorrow." :
      mode === "wrong" ? "No missed sentences." : "There’s nothing to solve here.") +
      '<div class="acts" style="justify-content:center;margin-top:18px"><a class="btn" href="index.html">Home</a></div></div>';
    return;
  }
  pos = -1; next();
})();
</script>
</body>
</html>
